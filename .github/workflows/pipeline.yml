name: Automated Running Data Pipeline

on:
  schedule:
    - cron: '0 2 * * 1'  # Lunes 2:00 UTC = Domingo 23:00 ART
  workflow_dispatch:      # Para ejecución manual

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4  # ACTUALIZADO (Elimina el aviso de Node 20)

      - name: Configurar Python
        uses: actions/setup-python@v5  # ACTUALIZADO (Elimina el aviso de Node 20)
        with:
          python-version: '3.11'  # Versión más moderna

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests matplotlib seaborn google-genai

      - name: Ejecutar Pipeline de Análisis
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Empaquetar y Subir Artefactos (CSV y Gráficos)
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rendimiento-running
          path: |
            reports/
            running_historico.csv
