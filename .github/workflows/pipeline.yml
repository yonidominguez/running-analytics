name: Automated Running Data Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Todos los días a las 02:00 UTC = 23:00 ART
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Coach Diario (TP Sync + Gemini + Intervals)
  # ==========================================
  daily-coach-report:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Sincronizar TrainingPeaks a Intervals (tp2intervals)
        if: ${{ secrets.TP_COOKIE != '' }}
        continue-on-error: true
        run: |
          docker run --rm \
            -e INTERVALS_API_KEY="${{ secrets.INTERVALS_API_KEY }}" \
            -e INTERVALS_ATHLETE_ID="${{ secrets.INTERVALS_ATHLETE_ID }}" \
            -e TP_AUTH_COOKIE="${{ secrets.TP_COOKIE }}" \
            ghcr.io/freekode/tp2intervals/tp2intervals:latest --sync-calendar

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests google-genai

      - name: Ejecutar Daily Coach
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.MAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily_coach.py

  # ==========================================
  # JOB 2: Análisis Histórico y Gráficos (Semanal)
  # ==========================================
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar ejecución semanal (Lunes 02:00 UTC / Domingo 23:00 ART)
        id: check_run
        run: |
          if [ "$(date +%u)" -eq 1 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_weekly_run=true" >> $GITHUB_ENV
          else
            echo "is_weekly_run=false" >> $GITHUB_ENV
          fi

      - name: Configurar Python
        if: env.is_weekly_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: env.is_weekly_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests matplotlib seaborn google-genai

      - name: Ejecutar Pipeline de Análisis
        if: env.is_weekly_run == 'true'
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Lógica de Frecuencia Mensual
        if: env.is_weekly_run == 'true'
        id: check_date
        run: |
          DAY=$(date +%d)
          if [ "$DAY" -le 7 ]; then
            echo "send_graphs=true" >> $GITHUB_ENV
          else
            echo "send_graphs=false" >> $GITHUB_ENV
          fi

      - name: Enviar Reporte COMPLETO (Gráficos + IA) - 1ra Semana
        if: env.is_weekly_run == 'true' && env.send_graphs == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 📊 Reporte Mensual de Running + Análisis IA
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions Runner
          body: "Adjunto los 5 gráficos de rendimiento histórico y el análisis de la última semana."
          attachments: reports/*

      - name: Enviar Reporte SOLO TEXTO (IA) - Resto del mes
        if: env.is_weekly_run == 'true' && env.send_graphs == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🤖 Análisis Semanal de Rendimiento y Fatiga
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions Runner
          body: "Adjunto el análisis fisiológico de Gemini de los últimos 7 días."
          attachments: reports/00_Analisis_Inteligencia_Deportiva.txt

      - name: Empaquetar y Subir Artefactos al Repo (Backup)
        if: env.is_weekly_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rendimiento-running
          path: |
            reports/
            running_historico.csv
